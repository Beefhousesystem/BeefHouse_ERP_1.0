# 防止 Supabase 免费版项目因「一周没有访问」被暂停：每 3 天向牛室的 Supabase 发一个很小的读取请求。
# 网址和 key 都是 index.html 里本来就公开的（publishable key，设计上可公开）；这里没有任何密钥。
# 请求只读 1 行（受数据库权限保护，匿名访问读不到任何资料，回 [] 就是正常），不会改任何数据。
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 */3 * *"   # 每 3 天 03:17 (UTC) 一次
  workflow_dispatch: {}       # 也可以在 GitHub 的 Actions 页面手动按 Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (database read)
        env:
          SUPABASE_URL: https://cogxtzduusuzjumsdkxy.supabase.co
          SUPABASE_KEY: sb_publishable_0BSR2rrDXtWGDc_5IgYJmw_4xveik9c
        run: |
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 30 --retry 3 --retry-delay 5 \
            "$SUPABASE_URL/rest/v1/erp_users?select=email&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $code"
          head -c 200 /tmp/resp.txt; echo
          if [ "${code:0:1}" != "2" ]; then
            echo "::error::Supabase 没有正常回应 (HTTP $code)。项目可能已被暂停，请到 Supabase 后台点 Restore。"
            exit 1
          fi
